name: postgresql
services:
  postgresql:
    container_name: postgresql
    image: "postgres:latest"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: on-failure:3
    networks:
      - postgresql
    volumes:
      - ./data:/var/lib/postgresql
    ports:
      - 5432:5432
networks:
  postgresql:
    name: postgresql
